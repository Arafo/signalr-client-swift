# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift E2E Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.credentials.outputs.enabled }}
    steps:
      - name: Check Azure E2E configuration
        id: credentials
        env:
          CONNECTION_STRING: ${{ secrets.E2E_CONNECTION_STRING }}
        run: |
          if [[ -n "$CONNECTION_STRING" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure E2E tests require the E2E_CONNECTION_STRING secret; local integration tests run in the Swift workflow."
          fi

  E2ETest:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    name: E2E Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    strategy:
      matrix:
        os: [macos-15]

    steps:
    - uses: actions/checkout@v4

    - name: Get swift version
      run: swift --version

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Build .NET server
      working-directory: ./Tests/IntegrationTestServer
      run: dotnet build -p:DefineConstants="USE_AZURE_SIGNALR"

    - name: Start IntegrationTestServer
      working-directory: ./Tests/IntegrationTestServer
      env:
        Azure__SignalR__ConnectionString: ${{ secrets.E2E_CONNECTION_STRING }}
      run: dotnet run -p:DefineConstants="USE_AZURE_SIGNALR" &
      continue-on-error: false

    - name: Wait for server to start
      run: sleep 5
    
    - name: Run E2E tests
      env:
        SIGNALR_INTEGRATION_TEST_URL: http://localhost:8080/test
      run: swift test --jobs 2 --filter SignalRClientIntegrationTests
